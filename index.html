<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OPERACIÓN SOBRIEDAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#7ab623;--gd:#5c9317;--n:#1d1c51;--n2:#1d1c51;--nl:#2e2d74;--y:#f2a621;--yl:#ffd27a;--t1:#1d5fb6;--t1d:#154586;--t2:#5c9317;--t2d:#456e10;--s:#35b6f0;--bg:#eef1ec;--line:#dde3d6;--soft:#565a72;--t:#f7f8f4;--fd:'Baloo 2',sans-serif;--fb:'IBM Plex Sans',sans-serif;--fm:'IBM Plex Mono',monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 900px 500px at 10% -10%,rgba(29,95,182,.10),transparent 60%),radial-gradient(ellipse 800px 500px at 100% 100%,rgba(122,182,35,.12),transparent 60%),var(--bg);color:var(--n);font-family:var(--fb);display:flex;justify-content:center;padding:20px 12px;overflow-x:hidden}
.stage{width:100%;max-width:780px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px -24px rgba(29,28,81,.22);padding:22px 20px 20px;overflow:hidden}
.brandbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}.brandbar .p{height:44px}.brandbar .m{height:64px;margin:-4px 0}
.lt{line-height:1;font-family:var(--fd)}.lt b{display:block;font-size:28px;color:var(--g)}.lt i{display:block;font-style:normal;font-size:28px;font-weight:800;color:var(--n)}
.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}#clock{font-family:var(--fm);font-weight:700;font-size:13px;background:var(--n);color:#fff;padding:5px 12px;border-radius:20px}#clock.r{background:#c1443c}
.tb{font-family:var(--fb);font-weight:700;font-size:12px;background:#fff;color:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
h1{font-family:var(--fd);font-size:28px;font-weight:800;margin:2px 0 6px;text-align:center;line-height:1.2}h2{font-family:var(--fd);font-size:20px;font-weight:800;margin:4px 0 8px}
p{color:var(--soft);font-size:14.5px;line-height:1.55}b{color:var(--n)}
.turn{display:inline-block;font-family:var(--fm);font-weight:700;font-size:11.5px;color:#fff;background:var(--n);padding:4px 11px;border-radius:20px;letter-spacing:.05em;margin:4px 0 10px}
.runway-wrap{margin-bottom:16px;background:var(--t);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px}.score-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.score-chip{position:relative;display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:10px;font-family:var(--fm);font-weight:700;font-size:12px;border:2px solid transparent;flex:1}.score-chip small{font-size:10px;font-weight:600}
.score-chip.t1{background:rgba(29,95,182,.12);color:var(--t1d)}.score-chip.t2{background:rgba(92,147,23,.12);color:var(--t2d)}.score-chip.on{border-color:var(--y)}.score-chip .num{font-family:var(--fd);font-size:26px;margin-left:auto}
.adj{display:flex;flex-direction:column;gap:2px}.adj button{border:0;border-radius:6px;background:#fff;color:var(--n);font-weight:800;width:22px;height:17px;line-height:1;cursor:pointer;font-size:13px}
.track{position:relative;height:56px;margin:4px 4px 0}.track-line{position:absolute;top:28px;left:0;right:0;height:4px;background:#dfe4d8;border-radius:4px}.track-nodes{position:absolute;top:0;left:0;right:0;height:56px;display:flex;justify-content:space-between;align-items:center}
.t-node{width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid #b9c0ab;z-index:1;position:relative}.t-node span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-family:var(--fm);font-size:8px;color:var(--soft);white-space:nowrap}.t-node.dest{border-color:var(--y)}
.plane-tok{position:absolute;top:2px;font-size:20px;transition:left .6s cubic-bezier(.4,0,.2,1);z-index:3}.plane-tok.p1{transform:translate(-50%,0);filter:drop-shadow(0 2px 3px rgba(29,95,182,.5))}.plane-tok.p2{top:16px;transform:translate(-50%,0) scaleX(-1);filter:drop-shadow(0 2px 3px rgba(92,147,23,.5))}
.rl{font-family:var(--fm);font-size:11px;font-weight:700;color:var(--soft);text-align:center;margin-top:6px}.bar{display:flex;gap:6px;margin-top:6px}.bar i{flex:1;height:8px;border-radius:6px;background:#dfe4d8;cursor:pointer}.bar i.d{background:var(--g)}.bar i.c{background:var(--y)}
.pop{position:absolute;right:30px;top:-6px;font-family:var(--fd);font-size:34px;font-weight:800;color:var(--gd);animation:up 1.6s forwards;pointer-events:none}@keyframes up{to{transform:translateY(-50px) scale(1.3);opacity:0}}
.big,.btn{font-family:var(--fb);font-weight:700;font-size:15px;border:0;border-radius:14px;padding:14px 20px;cursor:pointer;transition:transform .15s}.big:active,.btn:active{transform:scale(.96)}
.big{background:linear-gradient(180deg,var(--yl),var(--y));color:#3a2705;box-shadow:0 8px 18px -8px rgba(242,166,33,.6)}.big.g,.big.t2{background:linear-gradient(180deg,#92c24a,var(--t2));color:#fff;box-shadow:0 8px 18px -8px rgba(92,147,23,.5)}.big.t1{background:linear-gradient(180deg,#3f7ecf,var(--t1));color:#fff;box-shadow:0 8px 18px -8px rgba(29,95,182,.55)}.big.r{background:linear-gradient(180deg,#d8665e,#c1443c);color:#fff}
.big:disabled,.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-navy{background:linear-gradient(180deg,var(--nl),var(--n));color:#fff}.btn-ghost{background:#fff;color:var(--soft);border:1.5px solid var(--line)}
#nav{gap:10px;margin-top:16px}#nav .btn{flex:1}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}.row .big{flex:1;min-width:140px}
.card{background:var(--t);border:1.5px solid var(--line);border-radius:12px;padding:16px;font-size:15.5px;font-weight:500;line-height:1.5;margin:10px 0}.card.ok{background:rgba(122,182,35,.1);border-color:rgba(122,182,35,.4);color:var(--gd)}.card.ko{background:rgba(193,68,60,.08);border-color:rgba(193,68,60,.3);color:#a13a32}
.msg{padding:13px 15px;border-radius:10px;background:rgba(122,182,35,.1);border:1px solid rgba(122,182,35,.4);color:var(--gd);font-size:14px;line-height:1.5;margin:12px 0;font-weight:600}
.cnt{background:var(--t);border:1.5px solid var(--line);border-radius:12px;padding:14px;text-align:center;flex:1;min-width:230px}.cnt .big{font-size:14px;padding:10px 14px;margin:4px}
input{font-family:var(--fb);font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);width:min(300px,100%);margin:5px;text-align:center}
#grid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;max-width:420px;width:100%;touch-action:none;user-select:none}#grid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--t);border:1px solid var(--line);border-radius:4px;font-family:var(--fm);font-weight:700;font-size:14px;cursor:pointer}
#grid div.sel{background:var(--yl);border-color:var(--y)}#grid div.f0{background:rgba(29,95,182,.3);border-color:var(--t1)}#grid div.f1{background:rgba(122,182,35,.4);border-color:var(--g)}
.ws{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start}.wl{min-width:150px}.wl div{font-family:var(--fm);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;border:1.5px solid var(--line);margin:4px 0}.wl .f{text-decoration:line-through;color:var(--gd);border-color:var(--g)}
#kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}#kb button{font-family:var(--fm);font-weight:700;font-size:14px;width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--t);color:var(--n);cursor:pointer}#kb button:disabled{opacity:.3}
.hw{font-family:var(--fm);font-weight:700;letter-spacing:.14em;text-align:center;font-size:22px;margin:6px 0}
.sig{border-radius:14px;text-align:center;padding:26px;font-family:var(--fd);font-size:34px;font-weight:800;color:#fff;margin:10px 0;animation:pu .5s}@keyframes pu{from{transform:scale(.8)}to{transform:scale(1)}}
.win{font-family:var(--fd);font-size:26px;font-weight:800;text-align:center}.runway-final{position:relative;height:80px;background:linear-gradient(180deg,transparent 55%,rgba(122,182,35,.1) 55%);border-radius:10px;margin:8px 0;overflow:hidden}.runway-final .rline{position:absolute;bottom:12px;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#b9c0ab 0 14px,transparent 14px 26px)}.runway-final .rplane{position:absolute;font-size:32px;left:50%;top:6px;transform:translateX(-50%);animation:rise 1.6s ease-out}@keyframes rise{0%{top:40px;opacity:0}100%{top:6px;opacity:1}}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:99;animation:cf 3s linear forwards}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}.fade-in,.fin{animation:fi .35s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lbr{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;margin:5px 0;background:var(--t);text-align:left}.lbr b{flex:1}.lbr small{font-family:var(--fm);font-size:11px;color:var(--soft)}.lbr .num2{font-family:var(--fd);font-size:22px;font-weight:800}.lbr.me{border-color:var(--y);background:rgba(242,166,33,.15)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(max-width:560px){.score-row{flex-direction:column}}
.lesson{background:rgba(242,166,33,.14);border-left:6px solid var(--y);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:14.5px;line-height:1.5;text-align:left}
.lg{font-family:var(--fm);font-size:12px;font-weight:700;padding:4px 10px;border:1.5px solid var(--line);border-radius:20px}
.pass{border:2px dashed var(--y);border-radius:14px;overflow:hidden;margin:12px auto;max-width:420px;text-align:left;background:#fff}.ph{background:linear-gradient(90deg,var(--t1),var(--g));color:#fff;padding:10px 14px;display:flex;justify-content:space-between;font-family:var(--fm);font-size:11px;font-weight:700}
.pb{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px}.pb small{display:block;font-family:var(--fm);font-size:10px;color:var(--soft)}.pb b{font-family:var(--fd);font-size:19px}.bc{height:34px;margin:0 14px 12px;background:repeating-linear-gradient(90deg,var(--n) 0 2px,#fff 2px 5px,var(--n) 5px 6px,#fff 6px 10px)}
.ov{position:fixed;inset:0;background:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:ovo 2.4s forwards}.ovp{font-size:90px;animation:tk 2.2s ease-in forwards}@keyframes tk{from{transform:translate(-140px,60px)}to{transform:translate(180px,-140px) scale(1.4)}}@keyframes ovo{0%,80%{opacity:1}100%{opacity:0;visibility:hidden}}
</style></head><body>

{q:"Si como parte de un tratamiento médico de ARL o EPS (debidamente recetado) estoy medicado con alguna droga con componentes psicoactivos, ¿de acuerdo a la política de la empresa cómo debo proceder?",o:["Me reservo la información","Notifico de inmediato al Jefe de base o Gestión Humana de la Base y a Salud en el Trabajo ADM, con el respectivo documento del medicamento recetado por el médico","Le comento a mis compañeros la situación para que me apoyen"],a:1,e:"Debes notificar de inmediato al Jefe de base o Gestión Humana de la Base y a Salud en el Trabajo ADM, con el soporte médico. Informar a tiempo protege tu salud y la operación."}]},
3:{t:"DECISIONES Y CONSECUENCIAS",it:[
{q:"Si voy en mi moto o vehículo bajo efectos de drogas o alcohol y lesiono gravemente a una persona o esta fallece:",o:["El no estar en sus «cinco sentidos» lo exonera de toda responsabilidad, ya que no estaba en pleno uso de sus facultades","Solo tiene responsabilidad si lesiona a un menor de edad","No lo exonera de la responsabilidad legal, ya que el consumo de sustancias psicoactivas fue una decisión individual"],a:2,e:"El consumo fue una decisión individual: no exonera de la responsabilidad legal. Decidir no consumir también protege a otros."},
{q:"Si un empleado de Talma tiene resultado positivo para sustancias psicoactivas:",o:["Se suspenden sus labores por ese día y luego retorna normal sus tareas","Sigue laborando normalmente","Se suspenden sus labores hasta realizar el proceso administrativo correspondiente para determinar la consecuencia de la falta"],a:2,e:"Se suspenden las labores hasta realizar el proceso administrativo correspondiente, que determina la consecuencia de la falta."},
{q:"Si como empleado en Talma tengo un resultado positivo de alcohol o sustancias psicoactivas o me niego a la realización de una prueba de sustancias psicoactivas, la consecuencia más probable a nivel laboral es:",o:["Comer algo y seguir laborando","Es una falta grave al contrato de trabajo y por lo tanto una justa causa de terminación del vínculo laboral","Duerme 1 hora y después sigue laborando"],a:1,e:"Es una falta grave al contrato de trabajo y una justa causa de terminación del vínculo laboral. Negarse a la prueba tiene la misma consecuencia."},
{q:"Laborar bajo los efectos de las sustancias psicoactivas implica riesgos:",o:["Solo para la persona que está bajo los efectos de las sustancias psicoactivas","Solo se afecta la imagen de la empresa","Riesgos de lesiones en quien consume la sustancia psicoactiva, las personas con quien interactúa y consecuencias adversas para la empresa"],a:2,e:"Los riesgos alcanzan a quien consume, a las personas con quienes interactúa y a la empresa. La seguridad es un asunto de todos."}]}};
const ptq=(n,k)=>Math.floor(100/n)+(k<100%n?1:0);
const WORD="PREVENCIÓN",tot=a=>a.reduce((x,y)=>x+y,0),b=c=>c=="Ó"?"O":c;
let L=null,TM=null,DB=null,D={},tmr,R=null,P={},SYE="";
const mk=()=>({ch:0,sc:[0,0,0,0,0],dn:[0,0,0,0,0],qa:[[],[],[],[],[]],qv:[0,0,0,0,0],ws:null,fd:[],hg:{g:[],miss:0,w:0,over:0},n:"",fin:0,t0:Date.now(),scr:"play",cf:0});
const sv=()=>{try{if(L)localStorage.setItem("os_"+TM,JSON.stringify(L))}catch(e){}};
function updSy(){const e=$("#sy");if(!e)return;const ok=R||DB,er=SYE&&!R,n=PL().length;e.style.color=ok&&!er?"#5c9317":"#c1443c";e.textContent=!ok?"🔴 Sin conexión al marcador":er?"🔴 "+SYE:"🟢 "+n+" jugador"+(n==1?"":"es")+" en línea"}
function setSy(ok,m){SYE=ok?"":m;updSy()}
function PL(){const m={};Object.entries(D).forEach(([k,v])=>{if(Date.now()-(v.ts||0)<108e5)m[k]=Object.assign({pid:k},v)});Object.values(P).forEach(y=>{if(!m[y.pid]||(y.ts||0)>=(m[y.pid].ts||0))m[y.pid]=y});if(L&&TM=="P")m[L.id]={pid:L.id,n:L.n,sc:L.sc,st:tot(L.dn),fin:L.fin,ts:Date.now()};return Object.values(m)}
const rank=()=>PL().sort((a,b)=>tot(b.sc)-tot(a.sc)||((a.fin||9e15)-(b.fin||9e15)));
function lb(n){const r=rank().slice(0,n);return `<div>${r.map((p,i)=>`<div class="lbr ${L&&p.pid==L.id?"me":""}"><span>${["🥇","🥈","🥉"][i]||"#"+(i+1)}</span><b>${p.n||"Jugador"}</b><small>${p.fin?"🛬 terminó":"Reto "+Math.min(5,(p.st||0)+1)+"/5"}</small><span class="num2">${tot(p.sc)}</span></div>`).join("")||"<p>Esperando jugadores…</p>"}</div>`}
function push(){sv();if(!L||TM!="P")return;const o={n:L.n,sc:L.sc,st:tot(L.dn),fin:L.fin,ts:Date.now()};if(R)R.presence({pid:L.id,...o}).catch(()=>{});if(!DB){updSy();return}DB.doc("players/"+L.id).set(o).then(()=>setSy(1)).catch(e=>setSy(0,"Guardado compartido sin permiso ("+(e&&e.code||"error")+")"))}
function burst(n){for(let i=0;i<n;i++){const d=document.createElement("div");d.className="cf";d.style.left=Math.random()*100+"vw";d.style.background=["#f2a621","#7ab623","#1d5fb6","#35b6f0"][i%4];d.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}}
function clock(){clearInterval(tmr);const e=$("#clock");if(!L){e.style.display="none";return}e.style.display="";tmr=setInterval(()=>{const r=Math.max(0,600-Math.floor((Date.now()-L.t0)/1000));e.textContent="⏱ "+String(r/60|0).padStart(2,"0")+":"+String(r%60).padStart(2,"0");e.className=r<60?"r":""},500)}
const trk=(a,c)=>`<div class="track"><div class="track-line"></div><div class="track-nodes">${["SALIDA","CONTROL","TORRE","PISTA","DESTINO SEGURO"].map((l,i)=>`<div class="t-node ${i==4?"dest":""}"><span>${l}</span></div>`).join("")}</div><div class="plane-tok p1" style="left:${a}%">✈️</div>${c==null?"":`<div class="plane-tok p2" style="left:${c}%">✈️</div>`}</div>`;
function render(){clock();if(!TM)return home();if(TM=="TV")return tv();if(L.scr=="final")return final();head();[rq,rq,r3,rq,r5][L.ch]();nav()}
function head(){const r=rank(),pos=r.findIndex(p=>p.pid==L.id)+1;$("#score").style.display="block";$("#score").innerHTML=`<div class="runway-wrap"><div class="score-row"><div class="score-chip t1 on"><div>✈️ ${L.n}<br><small>Posición #${pos} de ${r.length}</small></div><span class="num">${tot(L.sc)}</span></div></div>${trk(Math.min(100,tot(L.sc)/5))}<div class="rl">RETO ${L.ch+1} DE 5 · ${CH[L.ch].toUpperCase()}</div><div class="bar">${CH.map((c,i)=>`<i class="${L.dn[i]?"d":i==L.ch?"c":""}" onclick="go(${i})"></i>`).join("")}</div></div><div class="rl" style="text-align:left">🏆 RANKING EN VIVO</div>${lb(5)}`}
function nav(){const n=$("#nav");n.style.display="flex";n.innerHTML=`<button class="btn btn-ghost" ${L.ch?"":"disabled"} onclick="go(${L.ch-1})">◀ Anterior</button><button class="btn btn-navy" ${L.dn[L.ch]?"":"disabled"} onclick="nx()">${L.ch==4?"Terminar misión 🏁":"Siguiente reto ▶"}</button>`}
function go(i){const f=L.dn.indexOf(0);if(i<0||(f>=0&&i>f))return;L.ch=i;sv();render()}
function nx(){if(L.ch<4){L.ch++;sv();render()}else{L.fin=Date.now();L.scr="final";push();render()}}
/* inicio */
function home(){$("#score").style.display="none";$("#nav").style.display="none";$("#st").innerHTML=`<div class="fade-in" style="text-align:center"><span class="turn">JUEGA Y COMPITE · RANKING EN VIVO</span><h1>✈️ OPERACIÓN SOBRIEDAD</h1><div class="row"><button class="big" style="max-width:320px" onclick="join('P')">▶️ INICIAR</button></div><div class="row"><button class="btn btn-ghost" onclick="join('TV')">📺 Pantalla general (proyector)</button></div><p id="cn" style="font-size:12px;color:#c1443c"></p></div>`;if(DB===false)$("#cn").textContent="⚠ Sin conexión con el marcador compartido. Abre el enlace iniciando sesión en claude.ai para ver el ranking en vivo."}
function join(k){TM=k;try{localStorage.os_team=k}catch(e){}if(k=="TV")return render();const v="";L=mk();L.id=Math.random().toString(36).slice(2,8);L.n=v||"Jugador "+L.id.slice(0,3).toUpperCase();push();const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="ovp">✈️</div><h1>¡DESPEGANDO!</h1><p>OPERACIÓN SOBRIEDAD · ${L.n}</p>`;document.body.appendChild(o);setTimeout(()=>o.remove(),2500);render()}
function leave(c){if(c&&!confirm("¿Salir? Se perderá el avance de este dispositivo."))return;if(c&&L&&DB)DB.doc("players/"+L.id).delete().catch(()=>{});if(R)R.presence({pid:null,n:null,sc:null,st:null,fin:null,ts:null}).catch(()=>{});try{localStorage.removeItem("os_team");localStorage.removeItem("os_P")}catch(e){}L=null;TM=null;render()}
function again(){if(DB&&L)DB.doc("players/"+L.id).delete().catch(()=>{});leave(0)}
function resetAll(){if(!confirm("¿Borrar el ranking para una nueva sesión?"))return;if(DB)DB.collection("players").get().then(s=>s.docs.forEach(d=>DB.doc("players/"+d.id).delete().catch(()=>{}))).catch(()=>{});D={};render()}
/* retos de preguntas */
function rq(){const i=L.ch,G=QZ[i],n=G.it.length,k=Math.min(L.qv[i]||0,n-1),I=G.it[k],c=L.qa[i][k],pt=ptq(n,k),o=G.o||I.o;
 const cartel="";
 $("#st").innerHTML=`<h2>RETO ${i+1} · ${G.t}</h2><span class="turn">PREGUNTA ${k+1} DE ${n} · ${pt} PTS</span>${cartel}<div class="card">${I.q}</div>`+(c!=null?`<div class="card ${c==I.a?"ok":"ko"}"><b>${c==I.a?"✔ ¡Correcto! +"+pt+" puntos":"✘ La respuesta correcta era: "+o[I.a]}</b></div><div class="lesson">💡 <b>Enseñanza:</b> ${I.e}</div>${k<n-1?`<div class="row"><button class="big" onclick="L.qv[${i}]=${k+1};sv();render()">Siguiente pregunta ▶</button></div>`:""}`:`<div class="row" style="flex-direction:${o.length>2?"column":"row"}">${o.map((x,j)=>`<button class="big ${j==0?"t1":j==1?"":"g"}" style="text-align:left" onclick="pick(${j})">${o.length>2?"ABC"[j]+". ":""}${x}</button>`).join("")}</div>`)}
function pick(j){const i=L.ch,G=QZ[i],k=L.qv[i]||0;if(L.qa[i][k]!=null)return;L.qa[i][k]=j;if(j==G.it[k].a){L.sc[i]+=ptq(G.it.length,k);burst(30)}if(L.qa[i].filter(x=>x!=null).length==G.it.length)L.dn[i]=1;push();render()}
/* reto 3 */
function gen(){const N=12,g=Array.from({length:N},()=>Array(N).fill("")),D4=[[1,0],[0,1],[1,1],[1,-1]];WD.forEach(([w],k)=>{for(let t=0;t<800;t++){const d=D4[(k+(t>40?t:0))%4],x=Math.random()*N|0,y=Math.random()*N|0,ex=x+d[0]*(w.length-1),ey=y+d[1]*(w.length-1);if(ex<0||ex>=N||ey<0||ey>=N)continue;let ok=1;for(let j=0;j<w.length;j++){const c=g[y+d[1]*j][x+d[0]*j];if(c&&c!=w[j])ok=0}if(!ok)continue;for(let j=0;j<w.length;j++)g[y+d[1]*j][x+d[0]*j]=w[j];break}});const A="ABCDEFGHIJLMNOPRSTUV";return g.map(r=>r.map(c=>c||A[Math.random()*A.length|0]))}
function r3(){if(!L.ws)L.ws=gen();const n=L.fd.length,f=1;let c="";for(let y=0;y<12;y++)for(let x=0;x<12;x++)c+=`<div data-i="${y*12+x}" class="${L.fd.some(q=>q.c.includes(y*12+x))?"f"+f:""}">${L.ws[y][x]}</div>`;
 $("#st").innerHTML=`<h2>RETO 3 · DESCUBRE Y PREVIENE</h2><span class="turn">ENCONTRADAS ${n}/${WD.length} · ${L.sc[2]} PTS</span><div class="ws"><div id="grid">${c}</div><div class="wl">${WD.map((w,i)=>`<div class="${L.fd.some(q=>q.w==i)?"f":""}">${w[1]}</div>`).join("")}</div></div>`+(L.dn[2]?`<div class="lesson">💡 <b>Enseñanza:</b> La prevención comienza con tus decisiones: evita el consumo, cuida tu salud y protege cada operación. En Talma la tolerancia es CERO.</div>`:`<p>Arrastra con el dedo o el mouse desde la primera hasta la última letra. Cada palabra suma puntos.</p><div class="row"><button class="btn btn-ghost" onclick="L.dn[2]=1;push();render()">Terminar reto</button></div>`);if(!L.dn[2])bind()}
function line(a,b2){const ax=a%12,ay=a/12|0,bx=b2%12,by=b2/12|0,dx=bx-ax,dy=by-ay,N=Math.max(Math.abs(dx),Math.abs(dy));if(!(dx==0||dy==0||Math.abs(dx)==Math.abs(dy)))return[a];const r=[];for(let j=0;j<=N;j++)r.push((ay+Math.sign(dy)*j)*12+ax+Math.sign(dx)*j);return r}
function bind(){const gr=$("#grid");let s=null,cur=[];const at=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.dataset.i!=null?+el.dataset.i:null},paint=()=>gr.querySelectorAll("div").forEach(d=>d.classList.toggle("sel",cur.includes(+d.dataset.i)));
 gr.onpointerdown=e=>{const i=at(e);if(i==null)return;s=i;cur=[i];paint();e.preventDefault()};gr.onpointermove=e=>{if(s==null)return;const i=at(e);if(i!=null){cur=line(s,i);paint()}};
 gr.onpointerup=()=>{if(s==null)return;const w=cur.map(i=>L.ws[i/12|0][i%12]).join(""),rw=[...w].reverse().join(""),k=WD.findIndex(([x],j)=>(x==w||x==rw)&&!L.fd.some(f=>f.w==j));s=null;if(k>=0){L.fd.push({w:k,c:cur});L.sc[2]=Math.round(100*L.fd.length/WD.length);if(L.fd.length==WD.length){L.dn[2]=1;burst(60)}push()}render()}}
/* reto 5 */
function r5(){const h=L.hg,P=["<circle cx='150' cy='60' r='20'/>","<line x1='150' y1='80' x2='150' y2='140'/>","<line x1='150' y1='95' x2='120' y2='125'/>","<line x1='150' y1='95' x2='180' y2='125'/>","<line x1='150' y1='140' x2='125' y2='180'/>","<line x1='150' y1='140' x2='175' y2='180'/>"],vis=[...WORD].map(c=>h.g.includes(b(c))||h.over?c:"_").join(" "),fin=h.w||h.over;
 $("#st").innerHTML=`<h2>RETO 5 · LA PALABRA QUE PROTEGE TU OPERACIÓN</h2><div class="ws" style="align-items:center"><svg width="150" height="150" viewBox="40 0 160 200" fill="none" stroke="#f2a621" stroke-width="6" stroke-linecap="round"><path d="M50 195H120M85 195V10H150V40"/><g stroke="#1d1c51">${P.slice(0,h.miss).join("")}</g></svg><div><div class="hw">${vis}</div><p>Fallos: <b>${h.miss}</b> de 6</p></div></div><div class="card"><b>Pista:</b> Es la mejor herramienta para anticiparnos a los riesgos, evitar el consumo de sustancias psicoactivas y proteger nuestra salud y la seguridad de quienes nos rodean.</div>`+(fin?`<div class="msg">${h.w?"🎉 ¡Descubriste la palabra! +"+L.sc[4]+" puntos":"La palabra era PREVENCIÓN. 0 puntos"}</div><div class="lesson">💡 <b>Enseñanza:</b> No esperemos a que ocurra un incidente para actuar. La prevención comienza con nuestras decisiones, nuestros hábitos y la responsabilidad que tenemos con nosotros mismos y nuestros compañeros.</div>`:`<div id="kb">${[..."ABCDEFGHIJKLMNÑOPQRSTUVWXYZ"].map(l=>`<button ${h.g.includes(l)?"disabled":""} onclick="gu('${l}')">${l}</button>`).join("")}</div>`)}
function gu(l){const h=L.hg;if(h.w||h.over||h.g.includes(l))return;h.g.push(l);if([...WORD].some(c=>b(c)==l)){if([...WORD].every(c=>h.g.includes(b(c)))){h.w=1;L.sc[4]=Math.max(40,100-10*h.miss);L.dn[4]=1;burst(60)}}else{h.miss++;if(h.miss>=6){h.over=1;L.dn[4]=1}}push();render()}
/* tv y final */
function tv(){$("#score").style.display="none";$("#nav").style.display="none";$("#st").innerHTML=`<div style="text-align:center"><span class="turn">📺 PANTALLA GENERAL · EN VIVO</span><h2>🏆 Ranking · Operación Sobriedad</h2>${lb(15)}<div class="row"><button class="btn btn-ghost" onclick="resetAll()">↺ Borrar ranking (nueva sesión)</button></div></div>`}
const pass=(x,s)=>`<div class="pass"><div class="ph"><span>✈️ PASE DE ABORDAJE</span><span>OPERACIÓN SOBRIEDAD</span></div><div class="pb"><div><small>JUGADOR</small><b>${x.n}</b></div><div><small>PUNTOS</small><b>${s} / 500</b></div><div><small>DESTINO</small><b>OPERACIÓN SEGURA</b></div><div><small>ESTADO</small><b>¡LISTO PARA OPERAR!</b></div></div><div class="bc"></div></div>`;
function final(){$("#score").style.display="none";$("#nav").style.display="none";const r=rank(),pos=r.findIndex(p=>p.pid==L.id)+1,s=tot(L.sc);$("#st").innerHTML=`<div class="fade-in" style="text-align:center"><span class="turn">¡MISIÓN COMPLETADA!</span><div class="runway-final"><div class="rplane">✈️</div><div class="rline"></div></div><h1>🛬 ¡${L.n} aterrizó!</h1><div class="win" style="font-size:46px">${s} / 500</div><div style="font-family:var(--fm);font-size:12px;font-weight:700;color:var(--soft)">PUNTOS OBTENIDOS SOBRE EL TOTAL PARA GANAR</div><p>Posición actual: <b>#${pos} de ${r.length}</b><br>${L.sc.map((v,i)=>"R"+(i+1)+": "+v).join(" · ")}</p>${pass(L,s)}<h2>🏆 Ranking en vivo</h2>${lb(20)}<div class="lesson"><b>Mi compromiso:</b> no operaré si no estoy en condiciones, avisaré a tiempo y cuidaré a mi equipo.<br><b>La seguridad operacional también comienza con tus decisiones.</b></div><div class="card"><b>OPERACIÓN SOBRIEDAD</b><br>«Prevenir es una decisión diaria. Tu vida, tu equipo y cada operación cuentan contigo».</div><div class="row"><button class="btn btn-ghost" onclick="again()">↺ Jugar de nuevo</button></div></div>`;if(!L.cf){burst(120);L.cf=1;sv()}}
function onData(){updSy();if(L&&TM=="P"&&DB&&!D[L.id])push();if(TM=="TV"||(L&&L.scr=="final"))render();else if(L&&L.scr=="play")head()}
try{TM=localStorage.os_team||null;if(TM=="P"){L=JSON.parse(localStorage.os_P||"null");if(!L||!L.qa||!L.id){L=null;TM=null}}else if(TM!="TV")TM=null}catch(e){TM=null;L=null}
render();
(async()=>{
 try{R=typeof claude!="undefined"?await claude.use("room"):null}catch(e){R=null}
 try{DB=typeof claude!="undefined"?await claude.use("db"):null}catch(e){DB=null}
 if(R)R.onPeers(c=>{P={};c.peers.forEach(p=>{const y=p.presence||{};if(y.pid&&(!P[y.pid]||(y.ts||0)>(P[y.pid].ts||0)))P[y.pid]=y});onData()},()=>{});
 const rd=s=>{const nd={};s.docs.forEach(d=>nd[d.id]=d.data());if(JSON.stringify(nd)!=JSON.stringify(D)){D=nd;onData()}};
 if(DB){DB.collection("players").onSnapshot(rd,e=>setSy(0,"No se pudo leer el marcador ("+(e&&e.code||"error")+")"));setInterval(()=>DB.collection("players").get().then(rd).catch(()=>{}),4000)}
 if(!R&&!DB){DB=false;setSy(0,"Sin conexión al marcador compartido")}
 if(L)push();if(!TM)render();updSy()})();
</script></body></html>
